name: Recolha diária de promoções

on:
  schedule:
    - cron: "17 6 * * *"   # todos os dias às 06:17 UTC (~07:17 em Lisboa)
  workflow_dispatch: {}     # permite correr manualmente no separador Actions

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Recolher promoções e preços
        run: python -m collector.collect

      - name: Guardar dados atualizados
        run: |
          git config user.name "voos-ferias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
          else
            git commit -m "dados: recolha automática $(date -u +%F)"
            git push
          fi
